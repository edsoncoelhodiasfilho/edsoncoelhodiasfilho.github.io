<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eralis — Sistemas Oracle para o Varejo</title>
<meta name="description" content="Eralis — em breve.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a1220;
    --bg-panel:#0f1a2e;
    --bg-panel-2:#121f38;
    --moon-silver:#e9eef7;
    --moon-glow:#a9c0dd;
    --circuit-teal:#57d9c3;
    --circuit-teal-dim:#3a8f82;
    --grid-line:rgba(159,184,217,0.07);
    --text-dim:#8ea0bc;
    --serif:'Newsreader', serif;
    --mono:'IBM Plex Mono', monospace;
    --sans:'Inter', sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(87,217,195,0.08), transparent 60%),
      var(--bg-deep);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(87,217,195,0.08), transparent 60%);
    background-size: 56px 56px, 56px 56px, 100% 100%;
    background-position: center, center, center;
    color: var(--moon-silver);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a{color:inherit; text-decoration:none;}
  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--circuit-teal);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .wrap{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* ---------- NAV ---------- */
  nav.wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-top: 32px;
    padding-bottom: 32px;
  }
  .nav-word{
    font-family: var(--serif);
    font-size: 1.8rem;
    letter-spacing: 0.01em;
  }
  .brand{
    display:flex;
    align-items:center;
    gap: 14px;
  }
  .nav-logo{
    width: 46px;
    height: 46px;
    flex-shrink: 0;
  }
  .nav-word b.lis{ color: var(--circuit-teal); font-weight:500; }
  .nav-cta{
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--moon-glow);
    border: 1px solid rgba(169,192,221,0.25);
    padding: 9px 16px;
    border-radius: 3px;
    transition: border-color .2s ease, color .2s ease;
  }
  .nav-cta:hover{ border-color: var(--circuit-teal); color: var(--circuit-teal); }

  /* ---------- HERO ---------- */
  .hero{
    padding: 64px 0 96px;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 48px;
    align-items: center;
    position: relative;
    z-index: 0;
  }
  .hero-ship-layer{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  .hero-ship-behind{ z-index: -1; }
  .hero-ship-front{ z-index: 2; }
  .ship-mobile{ display: none; }
  .mobile-ship{
    position: absolute;
    pointer-events: none;
    opacity: 0;
    z-index: -1;
    animation: mobileShipArc 22s linear infinite;
  }
  .mobile-ship svg{ display:block; }
  @keyframes mobileShipArc{
    0%   { left: 2.0%;  top: 47.0%; opacity: 0; transform: translate(-50%,-50%) rotate(-65.0deg); }
    5%   { left: 6.8%;  top: 43.4%; opacity: 1; transform: translate(-50%,-50%) rotate(-64.2deg); }
    10%  { left: 11.6%; top: 39.9%; opacity: 1; transform: translate(-50%,-50%) rotate(-61.8deg); }
    15%  { left: 16.4%; top: 36.6%; opacity: 1; transform: translate(-50%,-50%) rotate(-57.9deg); }
    20%  { left: 21.2%; top: 33.5%; opacity: 1; transform: translate(-50%,-50%) rotate(-52.6deg); }
    25%  { left: 26.0%; top: 30.7%; opacity: 1; transform: translate(-50%,-50%) rotate(-46.0deg); }
    30%  { left: 30.8%; top: 28.4%; opacity: 1; transform: translate(-50%,-50%) rotate(-38.2deg); }
    35%  { left: 35.6%; top: 26.5%; opacity: 1; transform: translate(-50%,-50%) rotate(-29.5deg); }
    40%  { left: 40.4%; top: 25.1%; opacity: 1; transform: translate(-50%,-50%) rotate(-20.1deg); }
    45%  { left: 45.2%; top: 24.3%; opacity: 1; transform: translate(-50%,-50%) rotate(-10.1deg); }
    50%  { left: 50.0%; top: 24.0%; opacity: 1; transform: translate(-50%,-50%) rotate(0deg); }
    55%  { left: 54.8%; top: 24.3%; opacity: 1; transform: translate(-50%,-50%) rotate(10.1deg); }
    60%  { left: 59.6%; top: 25.1%; opacity: 1; transform: translate(-50%,-50%) rotate(20.1deg); }
    65%  { left: 64.4%; top: 26.5%; opacity: 1; transform: translate(-50%,-50%) rotate(29.5deg); }
    70%  { left: 69.2%; top: 28.4%; opacity: 1; transform: translate(-50%,-50%) rotate(38.2deg); }
    75%  { left: 74.0%; top: 30.7%; opacity: 1; transform: translate(-50%,-50%) rotate(46.0deg); }
    80%  { left: 78.8%; top: 33.5%; opacity: 1; transform: translate(-50%,-50%) rotate(52.6deg); }
    85%  { left: 83.6%; top: 36.6%; opacity: 1; transform: translate(-50%,-50%) rotate(57.9deg); }
    90%  { left: 88.4%; top: 39.9%; opacity: 1; transform: translate(-50%,-50%) rotate(61.8deg); }
    95%  { left: 93.2%; top: 43.4%; opacity: 1; transform: translate(-50%,-50%) rotate(64.2deg); }
    100% { left: 98.0%; top: 47.0%; opacity: 0; transform: translate(-50%,-50%) rotate(65.0deg); }
  }
  .eyebrow{
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--circuit-teal);
    margin-bottom: 22px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:"";
    width: 22px; height:1px;
    background: var(--circuit-teal-dim);
  }
  h1.headline{
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(2.4rem, 5vw, 3.6rem);
    line-height: 1.12;
    color: var(--moon-silver);
    max-width: 11.5ch;
  }
  h1.headline em{
    font-style: italic;
    font-weight: 400;
    color: var(--moon-glow);
  }
  .sub{
    margin-top: 24px;
    font-size: 1.02rem;
    color: var(--text-dim);
    max-width: 46ch;
  }
  .hero-actions{
    margin-top: 36px;
    display:flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .btn-primary{
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    background: var(--circuit-teal);
    color: #06231d;
    padding: 13px 22px;
    border-radius: 3px;
    font-weight: 500;
    transition: transform .15s ease, box-shadow .15s ease;
    display:inline-block;
  }
  .btn-primary:hover{ transform: translateY(-1px); box-shadow: 0 6px 24px rgba(87,217,195,0.25); }
  .btn-ghost{
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--moon-glow);
    padding: 13px 6px;
    border-bottom: 1px solid rgba(169,192,221,0.3);
  }
  .btn-ghost:hover{ color: var(--moon-silver); border-color: var(--moon-silver); }

  /* ---------- LOGO / MARK ---------- */
  .mark-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .mark-wrap svg{
    width: 100%;
    max-width: 320px;
    height: auto;
  }
  .orbit{
    stroke: rgba(169,192,221,0.18);
    stroke-dasharray: 2 6;
    fill:none;
  }
  .orbit-front{
    stroke: rgba(233,238,247,0.55);
    stroke-width: 1.3;
  }
  .moon-shadow{
    fill: var(--bg-deep);
  }
  .trace{
    fill:none;
    stroke: var(--circuit-teal);
    stroke-width: 1.4;
    stroke-linecap: round;
  }
  .node{
    fill: var(--circuit-teal);
  }
  .node-dim{
    fill: var(--moon-glow);
    opacity:0.55;
  }
  .pulse{ animation: pulse 1.8s ease-in-out infinite; }
  .spin-slow{ animation: spin 22s linear infinite; transform-origin: 120px 120px; }
  .spin-reverse{ animation: spin-reverse 14s linear infinite; transform-origin: 120px 120px; }
  .glow-breathe{ animation: glow-breathe 2.4s ease-in-out infinite; transform-origin: 120px 120px; }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.45; }
  }
  @keyframes spin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }
  @keyframes spin-reverse{
    from{ transform: rotate(360deg); }
    to{ transform: rotate(0deg); }
  }
  @keyframes glow-breathe{
    0%,100%{ opacity:0.55; transform: scale(1); }
    50%{ opacity:0.9; transform: scale(1.1); }
  }
  .eclipse-cycle{
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }
  .eclipse-cycle.trigger{
    animation: eclipseNow 10s ease-in-out;
  }
  @keyframes eclipseNow{
    0%{ transform: translate(0, 0) scale(1); }
    44%{ transform: translate(-26px, 18px) scale(1.18); }
    55%{ transform: translate(-26px, 18px) scale(1.18); }
    100%{ transform: translate(0, 0) scale(1); }
  }
  .eclipse-corona{
    transform-box: fill-box;
    transform-origin: 50% 50%;
    opacity: 0;
  }
  .eclipse-corona.trigger{
    animation: coronaNow 10s ease-in-out;
  }
  @keyframes coronaNow{
    0%{ opacity: 0; transform: scale(0.92); }
    44%{ opacity: 0.9; transform: scale(1); }
    55%{ opacity: 0.9; transform: scale(1); }
    100%{ opacity: 0; transform: scale(0.92); }
  }
  .mark-wrap svg{ cursor: pointer; }

  /* ---------- SERVICES ---------- */
  .services{
    padding: 72px 0;
    border-top: 1px solid rgba(169,192,221,0.1);
  }
  .services h2{
    font-family: var(--serif);
    font-weight: 500;
    font-size: 1.5rem;
    color: var(--moon-silver);
    margin-bottom: 8px;
  }
  .services > .wrap-note{
    color: var(--text-dim);
    font-size: 0.95rem;
    margin-bottom: 40px;
    max-width: 50ch;
  }
  .grid-cards{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: rgba(169,192,221,0.1);
    border: 1px solid rgba(169,192,221,0.1);
  }
  .card{
    background: var(--bg-panel);
    padding: 30px 28px;
  }
  .card .tag{
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--circuit-teal-dim);
    margin-bottom: 14px;
    display:block;
  }
  .card h3{
    font-family: var(--serif);
    font-weight: 500;
    font-size: 1.15rem;
    margin-bottom: 10px;
    color: var(--moon-silver);
  }
  .card p{
    color: var(--text-dim);
    font-size: 0.92rem;
  }

  /* ---------- STRIP ---------- */
  .strip{
    padding: 56px 0;
    border-top: 1px solid rgba(169,192,221,0.1);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .strip p{
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.15rem;
    color: var(--moon-glow);
    max-width: 40ch;
  }

  /* ---------- FOOTER ---------- */
  footer{
    border-top: 1px solid rgba(169,192,221,0.1);
    padding: 40px 0 48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  footer .foot-word{
    font-family: var(--serif);
    font-size: 1.1rem;
  }
  footer .foot-word b.lis{ color: var(--circuit-teal); font-weight:500; }
  footer .foot-meta{
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
  footer .foot-meta a{
    color: var(--moon-glow);
    border-bottom: 1px solid transparent;
  }
  footer .foot-meta a:hover{ border-color: var(--moon-glow); }

  /* ---------- CONTACT MODAL ---------- */
  .modal-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(6,10,18,0.72);
    backdrop-filter: blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    z-index: 100;
    opacity: 0;
    transition: opacity .22s ease;
  }
  .modal-backdrop[hidden]{ display:none; }
  .modal-backdrop.is-open{ opacity: 1; }

  .modal-panel{
    background: var(--bg-panel);
    border: 1px solid rgba(169,192,221,0.16);
    border-radius: 10px;
    max-width: 440px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    padding: 36px 32px 28px;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    transform: translateY(14px) scale(0.98);
    transition: transform .26s cubic-bezier(.2,.8,.2,1);
  }
  .modal-backdrop.is-open .modal-panel{
    transform: translateY(0) scale(1);
  }
  @media (prefers-reduced-motion: reduce){
    .modal-backdrop, .modal-panel{ transition: none; }
  }

  .modal-close{
    position: absolute;
    top: 14px; right: 14px;
    width: 32px; height: 32px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    border-radius: 50%;
    transition: color .15s ease, background .15s ease;
  }
  .modal-close:hover{ color: var(--moon-silver); background: rgba(169,192,221,0.1); }

  .modal-panel h2{
    font-family: var(--serif);
    font-weight: 500;
    font-size: 1.5rem;
    color: var(--moon-silver);
    margin-bottom: 6px;
  }
  .modal-sub{
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-bottom: 24px;
  }

  .field{ margin-bottom: 16px; }
  .field label{
    display:block;
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--moon-glow);
    margin-bottom: 7px;
  }
  .field input, .field textarea{
    width: 100%;
    background: var(--bg-panel-2);
    border: 1px solid rgba(169,192,221,0.18);
    border-radius: 4px;
    padding: 10px 12px;
    color: var(--moon-silver);
    font-family: var(--sans);
    font-size: 1rem;
    transition: border-color .15s ease;
  }
  .field input:focus, .field textarea:focus{
    outline: none;
    border-color: var(--circuit-teal);
  }
  .field textarea{ resize: vertical; min-height: 80px; }

  .checkbox-row{
    display:flex;
    align-items:center;
    gap: 9px;
    margin-bottom: 20px;
    font-size: 0.88rem;
    color: var(--text-dim);
    cursor:pointer;
  }
  .checkbox-row input{
    width: 16px; height:16px;
    accent-color: var(--circuit-teal);
  }

  .submit-btn{
    width: 100%;
    border: none;
    cursor: pointer;
    text-align:center;
  }
  .submit-btn:disabled{ opacity: 0.7; cursor: default; }

  .form-status{
    margin-top: 14px;
    font-size: 0.85rem;
    text-align:center;
    min-height: 1.2em;
  }
  .form-status.is-success{ color: var(--circuit-teal); }
  .form-status.is-error{ color: #e0916f; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 760px){
    .wrap{ padding: 0 22px; }
    nav.wrap{ padding-top: 24px; padding-bottom: 24px; }
    .ship-desktop{ visibility:hidden !important; opacity:0 !important; }
    .ship-mobile{ display:block; }
    .hero{
      grid-template-columns: 1fr;
      padding-top: 32px;
      padding-bottom: 64px;
      text-align:center;
    }
    .eyebrow{ justify-content:center; }
    .eyebrow::before{ display:none; }
    h1.headline{ max-width:none; margin:0 auto; }
    .sub{ margin-left:auto; margin-right:auto; }
    .hero-actions{ justify-content:center; }
    .hero-actions .btn-primary{ width:100%; text-align:center; }
    .mark-wrap{ order:-1; margin-bottom: 8px; }
    .mark-wrap svg{ max-width: 220px; }
    .grid-cards{ grid-template-columns: 1fr; }
    footer{ flex-direction:column; text-align:center; }
    .modal-backdrop{ padding: 16px; align-items: flex-end; }
    .modal-panel{
      max-height: 92vh;
      padding: 28px 22px 22px;
      border-radius: 14px 14px 0 0;
    }
  }

  @media (max-width: 420px){
    .wrap{ padding: 0 16px; }
    .nav-word{ font-size: 1.5rem; }
    .nav-logo{ width: 38px; height: 38px; }
    h1.headline{ font-size: 2.1rem; }
    .modal-panel{ padding: 24px 16px 18px; }
  }
</style>
</head>
<body>

<nav class="wrap">
  <div class="brand">
    <svg class="nav-logo" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Símbolo Eralis">
      <ellipse class="orbit" cx="120" cy="120" rx="100" ry="40"/>
      <circle class="moon-body" cx="120" cy="120" r="62" fill="url(#moonGrad)"/>
      <circle cx="98" cy="145" r="10" fill="#aebdd4" opacity="0.55" filter="url(#craterShadow)"/>
      <circle cx="86" cy="108" r="7" fill="#aebdd4" opacity="0.5" filter="url(#craterShadow)"/>
      <circle cx="108" cy="92" r="5.5" fill="#aebdd4" opacity="0.5" filter="url(#craterShadow)"/>
      <circle class="moon-shadow" cx="146" cy="102" r="56"/>
      <g class="trace">
        <path d="M 78 132 L 96 132 L 104 122 L 104 108"/>
        <circle class="node" cx="104" cy="108" r="3"/>
      </g>
    </svg>
    <div class="nav-word">era<b class="lis">lis</b></div>
  </div>
</nav>

<header class="hero wrap">
  <svg class="hero-ship-layer hero-ship-behind ship-desktop" viewBox="0 0 1000 380" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="trailGrad2" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#57d9c3" stop-opacity="0"/>
        <stop offset="100%" stop-color="#57d9c3" stop-opacity="0.85"/>
      </linearGradient>
    </defs>
    <g class="hero-ship">
      <animateMotion dur="30s" repeatCount="indefinite" rotate="auto"
        path="M 380 205 C 550 185 700 190 830 197 C 880 200 920 198 950 192 C 920 205 880 210 830 208 C 700 216 550 222 380 205 Z"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.09;0.48;0.52;1" dur="30s" repeatCount="indefinite"/>
      <path d="M -22 0 L -5 -4.5 L -5 4.5 Z" fill="url(#trailGrad2)"/>
      <path d="M -5 -5.5 L 13 0 L -5 5.5 Z" fill="#eef4fb"/>
      <circle cx="1.2" cy="0" r="1.8" fill="#57d9c3"/>
    </g>
  </svg>

  <svg class="hero-ship-layer hero-ship-front ship-desktop" viewBox="0 0 1000 380" preserveAspectRatio="none" aria-hidden="true">
    <g class="hero-ship">
      <animateMotion dur="30s" repeatCount="indefinite" rotate="auto"
        path="M 380 205 C 550 185 700 190 830 197 C 880 200 920 198 950 192 C 920 205 880 210 830 208 C 700 216 550 222 380 205 Z"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.52;0.91;0.97;1" dur="30s" repeatCount="indefinite"/>
      <path d="M -22 0 L -5 -4.5 L -5 4.5 Z" fill="url(#trailGrad2)"/>
      <path d="M -5 -5.5 L 13 0 L -5 5.5 Z" fill="#eef4fb"/>
      <circle cx="1.2" cy="0" r="1.8" fill="#57d9c3"/>
    </g>
  </svg>

  <!-- mobile: single ship, arcs from the left corner of "EM CONSTRUÇÃO" up behind the moons to the right corner -->
  <div class="mobile-ship ship-mobile" aria-hidden="true">
    <svg viewBox="0 0 34 16" width="34" height="16">
      <path d="M0 8 L11 4.5 L11 11.5 Z" fill="#57d9c3" opacity="0.55"/>
      <path d="M11 3 L31 8 L11 13 Z" fill="#eef4fb"/>
      <circle cx="16" cy="8" r="2.2" fill="#57d9c3"/>
    </svg>
  </div>

  <div>

    <div class="eyebrow">Em construção</div>
    <h1 class="headline">Algo novo está <em>a caminho.</em></h1>
    <p class="sub">Estamos preparando o espaço da Eralis. Em breve, mais novidades por aqui.</p>
    <div class="hero-actions">
      <button type="button" class="btn-primary" data-open-contact>Entrar em contato</button>
    </div>
  </div>

  <div class="mark-wrap" aria-hidden="true">
    <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Símbolo Eralis: lua crescente com crateras e traços de circuito">
      <defs>
        <radialGradient id="moonGrad" cx="34%" cy="28%" r="78%">
          <stop offset="0%" stop-color="#f6f9fd"/>
          <stop offset="52%" stop-color="#dde5f1"/>
          <stop offset="100%" stop-color="#9aaec9"/>
        </radialGradient>
        <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(87,217,195,0.32)"/>
          <stop offset="100%" stop-color="rgba(87,217,195,0)"/>
        </radialGradient>
        <filter id="craterShadow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="1"/>
        </filter>
        <clipPath id="moonClip">
          <circle cx="120" cy="120" r="62"/>
        </clipPath>
        <filter id="coronaGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="3.2"/>
        </filter>
        <linearGradient id="trailGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#57d9c3" stop-opacity="0"/>
          <stop offset="100%" stop-color="#57d9c3" stop-opacity="0.85"/>
        </linearGradient>
      </defs>

      <!-- soft halo glow, breathing -->
      <circle class="halo glow-breathe" cx="120" cy="120" r="82" fill="url(#haloGrad)"/>

      <!-- corona ring, only visible around the eclipse peak -->
      <circle class="eclipse-corona" cx="120" cy="120" r="74" fill="none" stroke="#eef4fb" stroke-width="2.6" filter="url(#coronaGlow)"/>

      <!-- inner orbit, spins opposite direction -->
      <g class="orbit-inner spin-reverse">
        <circle class="orbit" cx="120" cy="120" r="84"/>
        <circle class="node-dim" cx="120" cy="36" r="1.8"/>

      <!-- outer orbit, slow spin (back portion, behind the moon) -->
      <g class="orbit-outer spin-slow">
        <ellipse class="orbit" cx="120" cy="120" rx="100" ry="40"/>
        <circle class="node pulse" cx="120" cy="80" r="2.6"/>
        <circle class="node-dim" cx="204" cy="132" r="2"/>
        <circle class="node-dim" cx="38" cy="108" r="1.6"/>
        <circle class="node-dim" cx="150" cy="158" r="1.4"/>
      </g>

      <!-- moon sphere with realistic shading -->
      <circle class="moon-body" cx="120" cy="120" r="62" fill="url(#moonGrad)"/>

      <!-- craters, sitting on the lit face -->
      <g class="craters">
        <circle cx="98" cy="145" r="10" fill="#aebdd4" opacity="0.55" filter="url(#craterShadow)"/>
        <circle cx="95" cy="142" r="4" fill="#f4f7fb" opacity="0.4"/>

        <circle cx="86" cy="108" r="7" fill="#aebdd4" opacity="0.5" filter="url(#craterShadow)"/>
        <circle cx="84" cy="106" r="2.6" fill="#f4f7fb" opacity="0.35"/>

        <circle cx="108" cy="92" r="5.5" fill="#aebdd4" opacity="0.5" filter="url(#craterShadow)"/>
        <circle cx="106.5" cy="90.5" r="2" fill="#f4f7fb" opacity="0.35"/>

        <circle cx="78" cy="132" r="4.5" fill="#aebdd4" opacity="0.45" filter="url(#craterShadow)"/>
        <circle cx="122" cy="98" r="3.4" fill="#aebdd4" opacity="0.4" filter="url(#craterShadow)"/>
      </g>

      <!-- shadow side of the moon, phase crescent -->
      <circle class="moon-shadow eclipse-cycle" cx="146" cy="102" r="56"/>

      <!-- circuit traces etched on the crescent -->
      <g class="trace pulse">
        <path d="M 78 132 L 96 132 L 104 122 L 104 108"/>
        <circle class="node" cx="104" cy="108" r="3"/>
        <path d="M 86 152 L 100 152 L 108 162 L 122 162"/>
        <circle class="node" cx="122" cy="162" r="3"/>
        <path d="M 74 108 L 88 108 L 92 100"/>
        <circle class="node" cx="92" cy="100" r="2.4"/>
      </g>

      <!-- same ring, clipped to the moon's face: shows the segment currently sweeping in front -->
      <g class="orbit-outer spin-slow" clip-path="url(#moonClip)">
        <ellipse class="orbit orbit-front" cx="120" cy="120" rx="100" ry="40"/>
        <circle class="node pulse" cx="120" cy="80" r="2.6"/>

        <circle class="node-dim" cx="38" cy="108" r="1.6"/>

<div class="modal-backdrop" id="contactBackdrop" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="contactTitle">
    <button type="button" class="modal-close" data-close-contact aria-label="Fechar formulário de contato">&times;</button>

    <h2 id="contactTitle">Fale com a Eralis</h2>
    <p class="modal-sub">Deixe seus dados e retornamos em breve.</p>

    <form id="contactForm" action="https://formspree.io/f/mpqggzky" method="POST">
      <div class="field">
        <label for="f-nome">Nome</label>
        <input type="text" id="f-nome" name="nome" required autocomplete="name">
      </div>

      <div class="field">
        <label for="f-email">E-mail</label>
        <input type="email" id="f-email" name="email" required autocomplete="email">
      </div>

      <div class="field">
        <label for="f-telefone">Telefone</label>
        <input type="tel" id="f-telefone" name="telefone" autocomplete="tel" placeholder="(79) 90000-0000">
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="f-whatsapp" name="whatsapp" value="Sim">
        <span>Este número é WhatsApp</span>
      </label>

      <div class="field">
        <label for="f-mensagem">O que você precisa?</label>
        <textarea id="f-mensagem" name="mensagem" rows="4" required></textarea>
      </div>

      <button type="submit" class="btn-primary submit-btn">Enviar</button>

      <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

<script>
  (function(){
    var heroSvg = document.querySelector('.mark-wrap svg');
    var shadow = document.querySelector('.eclipse-cycle');
    var corona = document.querySelector('.eclipse-corona');
    if(!heroSvg || !shadow || !corona) return;

    var isEclipsing = false;
    var autoTimer = null;

    function runEclipse(){
      if(isEclipsing) return;
      isEclipsing = true;

      shadow.classList.add('trigger');
      corona.classList.add('trigger');

      shadow.addEventListener('animationend', function handler(){
        shadow.classList.remove('trigger');
        corona.classList.remove('trigger');
        shadow.removeEventListener('animationend', handler);
        isEclipsing = false;
      });
    }

    function scheduleAuto(){
      if(autoTimer) clearInterval(autoTimer);
      autoTimer = setInterval(runEclipse, 22000);
    }

    heroSvg.addEventListener('click', function(){
      runEclipse();
      scheduleAuto(); // restart the natural cadence after a manual trigger
    });

    scheduleAuto();
  })();
</script>

<script>
  (function(){
    var backdrop = document.getElementById('contactBackdrop');
    var panel = backdrop.querySelector('.modal-panel');
    var form = document.getElementById('contactForm');
    var status = document.getElementById('formStatus');
    var openers = document.querySelectorAll('[data-open-contact]');
    var closers = document.querySelectorAll('[data-close-contact]');
    var lastFocused = null;

    function openModal(){
      lastFocused = document.activeElement;
      backdrop.hidden = false;
      requestAnimationFrame(function(){ backdrop.classList.add('is-open'); });
      document.body.style.overflow = 'hidden';
      var firstField = document.getElementById('f-nome');
      if(firstField) firstField.focus();
    }

    function closeModal(){
      backdrop.classList.remove('is-open');
      document.body.style.overflow = '';
      setTimeout(function(){ backdrop.hidden = true; }, 220);
      if(lastFocused) lastFocused.focus();
    }

    openers.forEach(function(btn){ btn.addEventListener('click', openModal); });
    closers.forEach(function(btn){ btn.addEventListener('click', closeModal); });

    backdrop.addEventListener('click', function(e){
      if(e.target === backdrop) closeModal();
    });

    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && !backdrop.hidden) closeModal();
      if(e.key === 'Tab' && !backdrop.hidden){
        var focusable = panel.querySelectorAll('button, input, textarea');
        var first = focusable[0], last = focusable[focusable.length - 1];
        if(e.shiftKey && document.activeElement === first){
          e.preventDefault(); last.focus();
        } else if(!e.shiftKey && document.activeElement === last){
          e.preventDefault(); first.focus();
        }
      }
    });

    form.addEventListener('submit', function(e){
      e.preventDefault();
      var submitBtn = form.querySelector('.submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';
      status.textContent = '';
      status.className = 'form-status';

      fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      }).then(function(response){
        if(response.ok){
          form.reset();
          status.textContent = 'Mensagem enviada. Obrigado pelo contato!';
          status.classList.add('is-success');
          submitBtn.textContent = 'Enviar';
          submitBtn.disabled = false;
          setTimeout(closeModal, 1800);
        } else {
          throw new Error('Falha no envio');
        }
      }).catch(function(){
        status.textContent = 'Não foi possível enviar agora. Tente novamente ou escreva para contato@eralis.com.br.';
        status.classList.add('is-error');
        submitBtn.textContent = 'Enviar';
        submitBtn.disabled = false;
      });
    });
  })();
</script>
