<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obrigado pelo e-mail — ERALIS</title>
  <link rel="stylesheet" href="style.css?v=20260821-emailthankyou2">
  <style>
    .email-thanks-page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px 20px;
      box-sizing:border-box;
    }

    .email-thanks-card{
      width:min(620px,100%);
      text-align:center;
      padding:52px 40px;
      border-radius:24px;
      background:rgba(255,255,255,.96);
      box-shadow:0 18px 60px rgba(0,0,0,.12);
    }

    .email-thanks-logo{
      width:78px;
      height:78px;
      object-fit:contain;
      margin:0 auto 24px;
    }

    .email-thanks-card h1{
      margin:0 0 18px;
      font-size:clamp(28px,5vw,40px);
    }

    .email-thanks-card p{
      max-width:470px;
      margin:0 auto 30px;
      font-size:17px;
      line-height:1.7;
    }

    .email-thanks-card .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    @media(max-width:600px){
      .email-thanks-card{
        padding:40px 24px;
      }

      .email-thanks-card p{
        font-size:16px;
      }
    }
  </style>
</head>
<body>
  <main class="email-thanks-page">
    <section class="email-thanks-card">
      <img class="email-thanks-logo" src="assets/eralis-logo.png" alt="ERALIS">
      <h1>Obrigado pelo e-mail.</h1>
      <p>Daremos um retorno o mais rápido possível.</p>
      <a class="btn" href="index.html">Voltar ao site</a>
    </section>
  </main>
</body>
</html>
